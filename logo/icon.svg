<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <path d="M22 0 H78 Q100 0 100 22 V50 Q50 40 0 50 V22 Q0 0 22 0Z" fill="white" opacity="0.07"/>

  <!-- Bell body -->
  <g transform="translate(50, 47)">
    <path d="
      M0 -28
      C-1.5 -28, -3 -27, -3 -25.5
      L-3 -22
      C-15 -19, -23 -10, -23 3
      L-23 16
      C-23 19, -25.5 22, -27 23.5
      L27 23.5
      C25.5 22, 23 19, 23 16
      L23 3
      C23 -10, 15 -19, 3 -22
      L3 -25.5
      C3 -27, 1.5 -28, 0 -28
      Z"
      fill="white"
    />
    <ellipse cx="0" cy="27.5" rx="6" ry="3" fill="white"/>
  </g>

  <!-- Lightning bolt -->
  <g transform="translate(41, 38)">
    <polygon points="11,0 3,13 9,13 5,22 19,8 12,8 17,0" fill="url(#bolt)"/>
  </g>

  <!-- Notification dot -->
  <circle cx="73" cy="24" r="9" fill="#EF4444"/>
  <circle cx="73" cy="24" r="4.5" fill="#FCA5A5" opacity="0.5"/>

  <!-- Signal arcs -->
  <path d="M18 50 Q13 40 18 28" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.35"/>
  <path d="M82 50 Q87 40 82 28" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.35"/>
</svg>
