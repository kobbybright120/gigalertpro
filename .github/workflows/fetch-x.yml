name: Fetch Community Gigs (Craigslist + X/Nitter)

on:
  schedule:
    # Run every 5 minutes for the freshest gigs
    - cron: "*/5 * * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  fetch-community:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch Craigslist + X/Nitter gigs & store in Upstash
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
          # Optional overrides (defaults are built into the script)
          # NITTER_INSTANCES: "nitter.poast.org,nitter.privacydev.net,nitter.net"
          # NITTER_SEARCHES: "hiring developer,hiring designer,freelance gig"
        run: node scripts/fetch-x.js
