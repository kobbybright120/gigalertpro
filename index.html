    <!-- SoftwareApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "GigAlertPro",
        "url": "https://gigalertpro.com",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "GigAlertPro scans Reddit, X/Twitter, and Discord 24/7 for freelance gigs and client leads. Get instant alerts the second a gig is posted and generate an AI-written proposal in one click.",
        "screenshot": "https://gigalertpro.com/og-image.jpeg",
        "featureList": [
          "Real-time gig scanning across Reddit, X/Twitter, and Discord",
          "Instant alerts within seconds of a gig being posted",
          "AI-powered proposal generator",
          "Gig quality scoring (0-100)",
          "Keyword-based matching and filtering",
          "Browser and email notifications",
          "Multi-platform dashboard"
        ],
        "offers": [
          {
            "@type": "Offer",
            "name": "Free Plan",
            "price": "0",
            "priceCurrency": "USD",
            "description": "3 alerts per day, 1 platform (Reddit), 1 keyword. Free plan with option to upgrade."
          },
          {
            "@type": "Offer",
            "name": "Pro Plan",
            "price": "15",
            "priceCurrency": "USD",
            "description": "Unlimited alerts, all platforms, unlimited keywords, AI proposal generator, priority scanning every 2 minutes."
          },
          {
            "@type": "Offer",
            "name": "Team Plan",
            "price": "29",
            "priceCurrency": "USD",
            "description": "Everything in Pro plus up to 3 team members, shared dashboard, and priority support."
          }
        ],
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.9",
          "ratingCount": "2400",
          "bestRating": "5",
          "worstRating": "1"
        },
        "author": {
          "@type": "Organization",
          "name": "GigAlertPro",
          "url": "https://gigalertpro.com"
        }
      }
    </script>

    <!-- Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

        "sameAs": ["https://twitter.com/gigalertpro"],

    <!-- WebSite with SearchAction for Google Sitelinks Searchbox -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "GigAlertPro",
        "url": "https://gigalertpro.com",
        "description": "Find freelance gigs on Reddit, X/Twitter, and Discord before anyone else.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://gigalertpro.com/?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- FAQPage -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How fast do freelance gigs show up on GigAlertPro?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Very fast. GigAlertPro scans Reddit, X/Twitter, and Discord every 1 to 2 minutes. Most gigs appear in your feed within seconds of being posted on the original platform. Pro users get alerts with no refreshing required, and our fastest users apply within 3 minutes of a gig going live."
            }
          },
          {
            "@type": "Question",
            "name": "How is GigAlertPro different from Upwork or Fiverr?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "On Upwork and Fiverr, you are competing with 50 to 100 other freelancers on every job. GigAlertPro scans places most freelancers never check — Reddit subreddits, X/Twitter posts, and Discord servers — and alerts you within seconds. You are often the first person to reply, which is how you win."
            }
          },
          {
            "@type": "Question",
            "name": "What platforms does GigAlertPro scan for freelance gigs?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "GigAlertPro scans 37+ sources including Reddit (34+ subreddits like r/forhire, r/freelance, r/hiring), X/Twitter freelance accounts, and Discord community servers. New sources are added regularly. One dashboard replaces hours of manual searching across all these platforms."
            }
          },
          {
            "@type": "Question",
            "name": "What does the AI proposal generator do?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The AI proposal generator writes a personalized, ready-to-send freelance proposal in one click. It uses your profile, skills, and past wins to craft something that sounds like you — not a generic template. Freelancers report applying 10x faster. You generate, tweak a sentence or two, and send."
            }
          },
          {
            "@type": "Question",
            "name": "Is there a money back guarantee?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. GigAlertPro offers a 3-day money back guarantee on all paid plans. If you don't find relevant gigs within 3 days, email support@gigalertpro.com and we'll refund you completely — no questions asked. There is also a free plan with 3 alerts per day to explore."
            }
          },
          {
            "@type": "Question",
            "name": "Can I cancel my GigAlertPro subscription anytime?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Cancel anytime with one click from your account settings. No questions, no hidden fees, no lock-in. Your free plan remains active even after cancelling a paid subscription."
            }
          }
        ]
      }
    </script>
