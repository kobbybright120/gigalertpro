<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0B5"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <linearGradient id="bgDark" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgDark)"/>
  <rect width="512" height="256" rx="120" fill="white" opacity="0.03"/>
  <rect width="504" height="504" rx="116" x="4" y="4" fill="none" stroke="url(#accent)" stroke-width="6" opacity="0.2"/>

  <!-- Outer glow ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.1"/>

  <!-- Bell body -->
  <g filter="url(#glow)">
    <path d="M256 108 C244 108 234 118 234 130 L234 146 C194 156 164 192 164 238 L164 296 C164 308 152 320 144 328 L136 336 L376 336 L368 328 C360 320 348 308 348 296 L348 238 C348 192 318 156 278 146 L278 130 C278 118 268 108 256 108Z"
      fill="url(#accent)" opacity="0.92"/>
    <ellipse cx="256" cy="356" rx="38" ry="15" fill="url(#accent)" opacity="0.85"/>
  </g>

  <!-- Bell highlight -->
  <path d="M256 120 C248 120 242 126 242 132 L242 150 C208 162 184 194 184 234 L184 272 C184 272 196 262 196 252 L196 234 C196 200 216 172 248 162 L248 132 C248 128 251 120 256 120Z"
    fill="white" opacity="0.12"/>

  <!-- Lightning bolt -->
  <polygon points="276,190 242,256 262,256 248,310 304,242 280,242 294,190" fill="#020617"/>
  <polygon points="274,196 246,254 262,254 250,302 298,244 280,244 292,196" fill="#020617" opacity="0.6"/>

  <!-- Notification dot -->
  <g filter="url(#glow)">
    <circle cx="350" cy="138" r="38" fill="#00F0B5"/>
  </g>
  <circle cx="350" cy="138" r="20" fill="#020617" opacity="0.18"/>
  <circle cx="342" cy="128" r="10" fill="white" opacity="0.3"/>
</svg>
