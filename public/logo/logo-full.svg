<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" fill="none">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0B5"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
  </defs>

  <!-- Icon mark -->
  <rect width="80" height="80" rx="18" y="10" fill="#020617"/>
  <rect width="80" height="80" rx="18" y="10" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.35"/>

  <!-- Bell -->
  <path d="M40 26 C38 26 36.5 27.5 36.5 29.5 L36.5 32 C30 34 26 40 26 47 L26 56 C26 57.5 24.5 59 24 59.5 L56 59.5 C55.5 59 54 57.5 54 56 L54 47 C54 40 50 34 43.5 32 L43.5 29.5 C43.5 27.5 42 26 40 26Z" fill="url(#accent)"/>
  <ellipse cx="40" cy="63.5" rx="5.5" ry="2.8" fill="url(#accent)"/>

  <!-- Bolt cutout -->
  <polygon points="42.5,37 38,47 40.5,47 39,54 46,45.5 43,45.5 45,37" fill="#020617"/>

  <!-- Notification dot -->
  <circle cx="55" cy="26" r="5.5" fill="#00F0B5"/>
  <circle cx="55" cy="26" r="2.8" fill="#020617" opacity="0.25"/>

  <!-- Wordmark -->
  <text x="96" y="64" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="42" font-weight="800" letter-spacing="-1" fill="white">
    Gig<tspan fill="url(#accent)">Alert</tspan>
  </text>
  <!-- PRO badge -->
  <rect x="315" y="42" width="44" height="22" rx="5" fill="url(#accent)"/>
  <text x="337" y="57" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#020617" text-anchor="middle" letter-spacing="1.2">PRO</text>
</svg>
