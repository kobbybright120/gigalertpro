<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" fill="none">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0B5"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <linearGradient id="bgDark" x1="0" y1="10" x2="80" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="proBadge" x1="315" y1="42" x2="360" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0B5"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Icon mark background -->
  <rect width="80" height="80" rx="20" y="10" fill="url(#bgDark)"/>
  <rect width="80" height="40" rx="20" y="10" fill="white" opacity="0.03"/>
  <rect width="76" height="76" rx="18" x="2" y="12" fill="none" stroke="url(#accent)" stroke-width="1.2" opacity="0.2"/>

  <!-- Bell -->
  <g filter="url(#glow)">
    <path d="M40 26 C38 26 36.5 27.5 36.5 29.5 L36.5 32 C30 34 26 40 26 47 L26 56 C26 57.5 24.5 59 24 59.5 L56 59.5 C55.5 59 54 57.5 54 56 L54 47 C54 40 50 34 43.5 32 L43.5 29.5 C43.5 27.5 42 26 40 26Z"
      fill="url(#accent)" opacity="0.92"/>
    <ellipse cx="40" cy="63.5" rx="5.5" ry="2.5" fill="url(#accent)" opacity="0.85"/>
  </g>

  <!-- Bell highlight -->
  <path d="M40 28 C39 28 38 29 38 30 L38 32.5 C33 34.5 30 39 30 45 L30 52 C30 52 32 50.5 32 49 L32 45 C32 40 35 36 40 34 L40 30 C40 29.5 39.8 28 40 28Z"
    fill="white" opacity="0.12"/>

  <!-- Lightning bolt -->
  <polygon points="42.5,37 38,47 40.5,47 39,54 46,45.5 43,45.5 45,37" fill="#020617"/>

  <!-- Notification dot -->
  <g filter="url(#glow)">
    <circle cx="55" cy="25" r="5.5" fill="#00F0B5"/>
  </g>
  <circle cx="55" cy="25" r="2.8" fill="#020617" opacity="0.15"/>
  <circle cx="53.5" cy="23.5" r="1.5" fill="white" opacity="0.3"/>

  <!-- Wordmark -->
  <g filter="url(#textGlow)">
    <text x="96" y="64" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="42" font-weight="800" letter-spacing="-1" fill="white">
      Gig<tspan fill="url(#accent)">Alert</tspan>
    </text>
  </g>

  <!-- PRO badge with gradient -->
  <rect x="315" y="42" width="48" height="24" rx="7" fill="url(#proBadge)"/>
  <rect x="316" y="43" width="46" height="22" rx="6" fill="none" stroke="white" stroke-width="0.5" opacity="0.2"/>
  <text x="339" y="58" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="800" fill="#020617" text-anchor="middle" letter-spacing="1.5">PRO</text>
</svg>
