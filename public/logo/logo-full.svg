<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none">
  <defs>
    <!-- Premium gradient for the icon -->
    <linearGradient id="iconGrad" x1="0" y1="0" x2="60" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <!-- Bolt accent gradient -->
    <linearGradient id="boltGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <!-- Subtle glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Ring pulse -->
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- === ICON MARK (bell + bolt) === -->
  <g transform="translate(16, 10)">
    <!-- Outer ring pulse arcs -->
    <path d="M8 38 Q4 28 8 18" stroke="url(#ringGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M4 44 Q-2 30 4 14" stroke="url(#ringGrad)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M82 38 Q86 28 82 18" stroke="url(#ringGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M86 44 Q92 30 86 14" stroke="url(#ringGrad)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>

    <!-- Bell body -->
    <path d="
      M45 8
      C45 4, 45 4, 45 4
      C42 4, 40 6, 40 9
      L40 12
      C28 16, 20 28, 20 42
      L20 58
      C20 62, 16 66, 14 68
      L76 68
      C74 66, 70 62, 70 58
      L70 42
      C70 28, 62 16, 50 12
      L50 9
      C50 6, 48 4, 45 4
      Z"
      fill="url(#iconGrad)"
      filter="url(#glow)"
    />

    <!-- Bell highlight -->
    <path d="
      M45 12
      C34 16, 26 26, 26 42
      L26 52
      L28 42
      C28 28, 35 19, 45 15
      Z"
      fill="white" opacity="0.18"
    />

    <!-- Bell clapper -->
    <ellipse cx="45" cy="76" rx="10" ry="5" fill="url(#iconGrad)"/>

    <!-- Lightning bolt -->
    <g transform="translate(35, 28)">
      <polygon points="12,0 4,18 11,18 6,32 22,12 14,12 20,0" fill="url(#boltGrad)"/>
      <polygon points="12,0 4,18 11,18 6,32 22,12 14,12 20,0" fill="white" opacity="0.25"/>
    </g>

    <!-- Notification dot -->
    <circle cx="70" cy="16" r="8" fill="#EF4444"/>
    <circle cx="70" cy="16" r="4" fill="#FCA5A5" opacity="0.6"/>
  </g>

  <!-- === WORDMARK === -->
  <g transform="translate(120, 0)">
    <!-- "Gig" -->
    <text x="0" y="78" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" letter-spacing="-1" fill="#1E293B">
      Gig
    </text>
    <!-- "Alert" -->
    <text x="114" y="78" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" letter-spacing="-1" fill="url(#iconGrad)">
      Alert
    </text>
    <!-- "Pro" badge -->
    <g transform="translate(310, 44)">
      <rect x="0" y="0" width="56" height="26" rx="6" fill="url(#iconGrad)"/>
      <text x="28" y="18.5" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle" letter-spacing="1.5">
        PRO
      </text>
    </g>
  </g>

  <!-- Tagline -->
  <text x="120" y="102" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748B" letter-spacing="2">
    FIND GIGS BEFORE ANYONE ELSE
  </text>
</svg>
